{% extends 'main.html' %}
{% load crispy_forms_tags %}
{% block title %}Profile{% endblock %}
{% block content %}
       <h2>Your Profile</h2>
       <form method="post">
           {% csrf_token %}
           {{ form|crispy }}
           <button type="submit" class="btn btn-primary">Save Changes</button>
       </form>
       <a href="{% url 'accounts:order_history' %}" class="btn btn-secondary mt-2">View Order History</a>
       <a href="{% url 'store:product_list' %}" class="btn btn-secondary mt-2">Back to Products</a>
{% endblock %}
